client_id = "0fe7f09aff0777d307d7e2c5a7394ebe"
application_url = "https://senegal-o-lover-prints.trycloudflare.com"
embedded = true
name = "badger"
handle = "badger-1"

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/api/webhooks/app_scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/api/webhooks/app_uninstalled"

  [[webhooks.subscriptions]]
  uri = "/api/webhooks/customers_data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/api/webhooks/customers_redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/api/webhooks/shop_redact"
  compliance_topics = [ "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products"

[auth]
redirect_urls = [
  "https://senegal-o-lover-prints.trycloudflare.com/auth/callback",
  "https://senegal-o-lover-prints.trycloudflare.com/auth/shopify/callback",
  "https://senegal-o-lover-prints.trycloudflare.com/api/auth/callback"
]

[pos]
embedded = false

[build]
dev_store_url = "hakeems-sticker-store.myshopify.com"
automatically_update_urls_on_dev = true
include_config_on_deploy = true
